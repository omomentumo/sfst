<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Monitoring Dashboard</title>

  <!-- Navbar styles (shared) -->
  <link rel="stylesheet" href="/shared/navbar.css">

  <!-- Temperature styles -->
  <link rel="stylesheet" href="/Temperature/styles.css?v=plantlayout-20260602">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet">
</head>

<body data-sync-page="temperature">

  <div id="navbar"></div>

  <script src="/shared/navbar.js"></script>
  <script>
    fetch('/shared/navbar.html')
      .then(res => {
        if (!res.ok) throw new Error('Navbar failed to load');
        return res.text();
      })
      .then(html => {
        document.getElementById('navbar').innerHTML = html;
      })
      .catch(err => console.error(err));
  </script>

  <!-- =========================
       PAGE CONTENT
  ========================== -->
  <header>
    <h1>Temperature Monitoring Dashboard</h1>
  </header>

  <section class="dashboard-strip">
    <div class="summary">
      <div class="card req">
        <h2 id="count-req">0</h2>
        <span>Within Limit</span>
      </div>
      <div class="card out">
        <h2 id="count-out">0</h2>
        <span>Over Limit</span>
      </div>
    </div>

    <div class="filter-panel">
      <div class="controls">
        <button onclick="filterRooms('all')" class="btn" data-filter="all">Show All</button>
        <button onclick="filterRooms('req')" class="btn success" data-filter="req">
          <span class="btn-dot req"></span>
          Within Limit
        </button>
        <button onclick="filterRooms('out')" class="btn danger" data-filter="out">
          <span class="btn-dot out"></span>
          Over Limit
        </button>
      </div>
      <div class="requirements-controls">
        <span id="live-status" class="live-status" title="Live data link status">
          <span class="live-dot"></span><span class="live-text">Connecting…</span>
        </span>
        <a class="btn requirements-link" href="/api/temperature/history.csv">Export CSV</a>
        <a class="btn settings-link" href="/Temperature/settings/index.html" title="Edit room positions &amp; areas">⚙ Settings</a>
      </div>
    </div>
  </section>

  <section class="floorplan-wrapper">
    <div id="layout-viewport">
      <div id="layout-scale">
        <img id="layout-image" src="/Temperature/assets/plantlayout_r2.png" alt="Factory plant layout">
        <svg id="room-areas" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="room-layer"></div>
      </div>
    </div>
  </section>

  <div id="temperature-tooltip" class="temperature-tooltip" role="status" aria-live="polite"></div>

  <!-- Temperature logic -->
  <script src="/Temperature/app.js?v=plantlayout-20260602" defer></script>

</body>
</html>
