<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Layout Settings</title>
  <link rel="stylesheet" href="/shared/navbar.css">
  <link rel="stylesheet" href="/Temperature/styles.css?v=plantlayout-20260602">
  <link rel="stylesheet" href="/Temperature/settings/editor.css?v=editor-20260602c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body data-sync-page="temperature">
  <div id="navbar"></div>
  <script src="/shared/navbar.js"></script>
  <script>
    fetch('/shared/navbar.html')
      .then(res => res.ok ? res.text() : Promise.reject('nav'))
      .then(html => { document.getElementById('navbar').innerHTML = html; })
      .catch(err => console.error(err));
  </script>

  <!-- Password gate -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <h2>🔒 Settings Login</h2>
      <p>Enter the password to edit room positions and areas.</p>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="login-btn" class="btn primary">Unlock</button>
      <div id="login-error" class="login-error"></div>
      <a class="login-back" href="/Temperature/index.html">← Back to dashboard</a>
    </div>
  </div>

  <!-- Editor -->
  <div id="editor" class="editor hidden">
    <header class="editor-header">
      <h1>Room Layout Settings</h1>
      <div class="editor-actions">
        <span id="save-status" class="save-status"></span>
        <button id="save-btn" class="btn primary">💾 Save</button>
        <button id="reset-btn" class="btn danger-outline">Reset all</button>
        <button id="logout-btn" class="btn ghost">Logout</button>
        <a class="btn ghost" href="/Temperature/index.html">← Dashboard</a>
      </div>
    </header>

    <div class="editor-toolbar">
      <div class="tool-group">
        <span class="tool-label">Mode</span>
        <button id="mode-move" class="btn mode is-active" data-mode="move">↕ Move labels</button>
        <button id="mode-draw" class="btn mode" data-mode="draw">▱ Draw area</button>
      </div>

      <div class="tool-group">
        <span class="tool-label">Room</span>
        <select id="room-select"></select>
        <label class="limit-field">Limit °C
          <input id="room-limit" type="number" step="0.1" value="25">
        </label>
      </div>

      <div class="tool-group" id="draw-tools">
        <button id="undo-point" class="btn ghost">↶ Undo point</button>
        <button id="clear-area" class="btn ghost">✕ Clear area</button>
      </div>

      <div class="tool-group hint">
        <span id="mode-hint" class="mode-hint"></span>
      </div>
    </div>

    <section class="floorplan-wrapper editor-canvas">
      <div id="layout-viewport">
        <div id="layout-scale">
          <img id="layout-image" src="/Temperature/assets/plantlayout_r2.png" alt="Factory plant layout">
          <svg id="edit-areas" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="edit-markers"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="/Temperature/settings/editor.js?v=editor-20260602c" defer></script>
</body>
</html>
